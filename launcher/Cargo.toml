[package]
name = "omnivores-rust"
description = "Omnivores Rust: the launcher for the Carnivores rewrites and their mods"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "../games/windows_icon.rs"

[[bin]]
name = "omnivores-rust"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unpacking the zip archives mods come in; other archives go to 7-Zip and
# the like (importer.rs).
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
# The system's own file dialogs.
rfd = "0.15"
# Shortcuts (the shell's IShellLink), the desktop's whereabouts and the
# installed-apps entry (install.rs).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
